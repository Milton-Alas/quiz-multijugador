# =============================================================
# Quiz Multijugador — Docker Compose
# PostgreSQL y la aplicación Quarkus corren JUNTOS en la misma
# red de Docker:
#   db  : PostgreSQL 17 con volumen persistente (db-data)
#   app : aplicación Quarkus construida desde ./Dockerfile
#
# La app se conecta a la BD por el nombre del servicio "db" (DNS
# interno de compose), no por localhost. El estado de las partidas
# NO se persiste: vive en memoria de la app.
# =============================================================

name: quiz-multijugador

services:
  db:
    image: postgres:17-alpine
    container_name: quiz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: quiz
      POSTGRES_DB: quiz
    ports:
      # 5433 en el host para no chocar con otro PostgreSQL local en 5432.
      # Internamente (red de compose) la BD escucha en el 5432 de siempre.
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: quiz-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Conexión interna dentro de la red de compose (servicio "db")
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://db:5432/quiz
      QUARKUS_DATASOURCE_USERNAME: quiz
      QUARKUS_DATASOURCE_PASSWORD: quiz
    ports:
      - "8080:8080"

volumes:
  db-data:

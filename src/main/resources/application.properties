# =============================================================
# Quiz Multijugador — configuración
# FASE 1: base. FASE 2: datasource + Flyway (PostgreSQL en dev/prod,
# H2 en memoria para el perfil de test).
# =============================================================

quarkus.application.name=quiz-multijugador

# --- HTTP ---
quarkus.http.port=8080

# --- Datasource PostgreSQL (dev/prod) ---
# En Docker (compose.yaml) estas claves se sobrescriben con variables
# de entorno QUARKUS_DATASOURCE_* apuntando al servicio "db".
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=quiz
quarkus.datasource.password=quiz
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quiz
quarkus.datasource.jdbc.max-size=8

# --- Flyway ---
# El esquema lo gestiona Flyway (migraciones en db/migration).
quarkus.flyway.migrate-at-start=true

# --- Hibernate ORM ---
# Hibernate NO genera el esquema: lo crea Flyway.
quarkus.hibernate-orm.database.generation=none

# =============================================================
# Perfil de test: H2 en memoria en modo compatibilidad PostgreSQL.
# Las mismas migraciones Flyway corren sobre H2, lo que permite
# testear sin levantar PostgreSQL.
# =============================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:quiz;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.hibernate-orm.database.generation=none
